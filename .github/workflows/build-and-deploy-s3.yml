name: Build and Deploy Next.js to S3

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Select env by branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          echo "Branch: ${BRANCH}"

          if [ "${BRANCH}" = "main" ]; then
            echo "S3_BUCKET=${{ secrets.S3_BUCKET_PROD }}" >> "${GITHUB_ENV}"
            echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_PROD }}" >> "${GITHUB_ENV}"
          else
            echo "S3_BUCKET=${{ secrets.S3_BUCKET_DEV }}" >> "${GITHUB_ENV}"
            echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_DEV }}" >> "${GITHUB_ENV}"
          fi

      - name: Generate .env for build
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}" >> .env

      - name: Build Project
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::222634381337:role/s3-static-update-role
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure S3 static website fallback
        run: |
          if [ -z "${S3_BUCKET}" ]; then
            echo "Error: S3_BUCKET is not set"; exit 1;
          fi
          aws s3api put-bucket-website \
            --bucket "${S3_BUCKET}" \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}'

      - name: Deploy to S3
        run: |
          if [ -z "${S3_BUCKET}" ]; then
            echo "Error: S3_BUCKET is not set"; exit 1;
          fi
          aws s3 sync ./out "s3://${S3_BUCKET}" --delete

      - name: Purge Cloudflare cache (optional)
        shell: bash
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Cloudflare purge skipped (missing CLOUDFLARE_ZONE_ID/CLOUDFLARE_API_TOKEN secrets)."
            exit 0
          fi

          curl --fail --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Cloudflare cache purged."
